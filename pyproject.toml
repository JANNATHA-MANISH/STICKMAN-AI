[project]
name = "inkwell-studio"
version = "1.0.0"
description = "Inkwell — a stick-figure performance studio with Gemini/OpenRouter speech and Mercury directing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
]

# `uv run app` starts the static site AND the voice/planner service together.
[project.scripts]
app = "run_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["run_app.py"]
